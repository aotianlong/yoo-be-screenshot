<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Yoo Screenshot</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header class="header header-row">
      <h1 class="title">Yoo 截图</h1>
      <button type="button" id="open-settings" class="settings-link" title="默认设置">
        设置
      </button>
    </header>

    <section class="panel">
      <p class="panel-label">截图方式</p>
      <div class="choice-group" id="mode-group" role="group" aria-label="截图方式">
        <button type="button" class="choice is-active" data-mode="visible">可视区域</button>
        <button type="button" class="choice" data-mode="fullpage">整页</button>
        <button type="button" class="choice" data-mode="selection">选区</button>
      </div>
    </section>

    <section class="panel">
      <p class="panel-label">图片格式</p>
      <div class="choice-group compact" id="format-group" role="group" aria-label="图片格式">
        <button type="button" class="choice is-active" data-format="jpg">JPG</button>
        <button type="button" class="choice" data-format="png">PNG</button>
      </div>
    </section>

    <label class="toggle-row">
      <input type="checkbox" id="add-url" checked />
      <span>添加当前 URL</span>
    </label>

    <p id="status" class="status" hidden></p>

    <button type="button" id="capture" class="primary">开始截图</button>

    <p class="hint" id="hint"></p>

    <script src="defaults.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
